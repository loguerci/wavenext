# Config file for training WaveNeXt model

duration: 1
#duration: 0.68

# Model hyperparameters
#sample_rate: 48000 
sample_rate: 24000

#fft_dim: 2048
fft_dim: 1024

dim: 512

#shift_dim: 512
shift_dim: 320
n_mels: 128
k: 3

# Training hyperparameters
batch_size: 16
num_workers: 16
num_epochs: 1000
learning_rate: 0.0002
log_dir: "logs"

accelerator: "cuda:1"
devices: 1

dataset: "data/bigyuki_dataset.csv"

resume: false

prior: "encodec"  # or "same"
